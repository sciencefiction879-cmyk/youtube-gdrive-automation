name: YouTube Sequential Uploader

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot identifier (e.g. slot1, slot2)'
        required: false
        default: 'slot1'
      dry_run:
        description: 'Dry run (simulate without uploading to YouTube)'
        type: boolean
        required: false
        default: false
      force_video:
        description: 'Force specific video sequence (e.g. V1, V5)'
        required: false
        default: ''

  # Example scheduled cron (can be triggered externally or configured here)
  # schedule:
  #   - cron: '0 17 * * *'  # 17:00 UTC
  #   - cron: '0 19 * * *'  # 19:00 UTC

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg / ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials from Secrets
        env:
          GDRIVE_SERVICE_ACCOUNT_B64: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_B64 }}
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
        run: |
          mkdir -p credentials tokens data logs downloads
          
          if [ -n "$GDRIVE_SERVICE_ACCOUNT_B64" ]; then
            echo "$GDRIVE_SERVICE_ACCOUNT_B64" | base64 -d > credentials/gdrive_service_account.json
          fi
          
          if [ -n "$YOUTUBE_CLIENT_SECRET_B64" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_B64" | base64 -d > credentials/client_secret.json
          fi
          
          if [ -n "$YOUTUBE_OAUTH_TOKEN_B64" ]; then
            echo "$YOUTUBE_OAUTH_TOKEN_B64" | base64 -d > tokens/oauth_token.json
          fi

      - name: Run Sequential Uploader
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          CMD="python run.py"
          
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            CMD="$CMD --slot ${{ github.event.inputs.slot }}"
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          
          if [ -n "${{ github.event.inputs.force_video }}" ]; then
            CMD="$CMD --force-video ${{ github.event.inputs.force_video }}"
          fi
          
          echo "Executing: $CMD"
          $CMD

      - name: Commit and Push Updated State Database
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "data/state.db" ]; then
            git add data/state.db
            if ! git diff-index --quiet HEAD --; then
              git commit -m "Update upload state DB [skip ci]"
              for i in 1 2 3; do
                git pull --rebase origin main && git push origin main && break || sleep 5
              done
            else
              echo "No state database changes to commit."
            fi
          fi

      - name: Upload Run Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-logs
          path: logs/
          retention-days: 14
