# Channel & Pipeline Configuration

channel:
  id: "sciencefiction_channel"
  name: "Sci-Fi & 3D Animation Chronicles"
  owner_email: "sciencefiction879@gmail.com"

# Cloud Storage Source
storage_source: "mega"  # "mega" or "gdrive"

mega:
  folder_url: "https://mega.nz/folder/OORhyJ4A#hv02IpcssHV3xX6TYvU6Eg"

google_drive:
  folder_id: ""
  service_account_file: "credentials/gdrive_service_account.json"

youtube:
  client_secret_file: "credentials/client_secret.json"
  oauth_token_file: "tokens/oauth_token.json"
  default_category_id: "24"       # 24: Entertainment, 22: People & Blogs, 28: Sci & Tech
  default_privacy_status: "public" # public, unlisted, or private
  default_made_for_kids: false
  shorts_max_seconds: 180
  description_footer: "\n\n🔔 Subscribe to the channel for more epic 3D Sci-Fi and Animated adventures!"

settings:
  database_file: "data/state.db"
  downloads_dir: "downloads"
  logs_dir: "logs"
  auto_generate_metadata: true
  auto_generate_thumbnail: true
